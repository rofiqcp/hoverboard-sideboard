ekf_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.30
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.10
    print_diagnostics: true
    publish_tf: true
    predict_to_current_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    smooth_lagged_data: true
    history_length: 2.0
    permit_corrected_publication: true
    reset_on_time_jump: true

    # Local filtered pose/twist already contains LIO + slip-aware wheel aiding.
    odom0: /odometry/local
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 100
    odom0_differential: false
    odom0_relative: false

    # navsat_transform output: metric global position anchor from GNSS/RTK.
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 50
    odom1_differential: false
    odom1_relative: false
    odom1_pose_rejection_threshold: 10.0

    use_control: false
